version: '3.8'

services:
  # =============================================================================
  # DATABASE SERVICES
  # =============================================================================
  
  postgres:
    image: postgres:15-alpine
    container_name: smartcheques-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_cheques}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - smartcheques-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smart_cheques}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: smartcheques-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - smartcheques-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # APPLICATION SERVICES
  # =============================================================================

  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: production
    container_name: smartcheques-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_cheques}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID}
      FACTORY_ADDRESS: ${FACTORY_ADDRESS}
      OBLIGATION_REGISTRY_ADDRESS: ${OBLIGATION_REGISTRY_ADDRESS}
      DISPUTE_MANAGER_ADDRESS: ${DISPUTE_MANAGER_ADDRESS}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY}
      ORACLE_PRIVATE_KEY: ${ORACLE_PRIVATE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - smartcheques-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_DEFAULT_CHAIN_ID: ${CHAIN_ID}
        NEXT_PUBLIC_FACTORY_ADDRESS: ${FACTORY_ADDRESS}
        NEXT_PUBLIC_OBLIGATION_REGISTRY_ADDRESS: ${OBLIGATION_REGISTRY_ADDRESS}
        NEXT_PUBLIC_DISPUTE_MANAGER_ADDRESS: ${DISPUTE_MANAGER_ADDRESS}
        NEXT_PUBLIC_ETH_MAINNET_RPC: ${ETH_MAINNET_RPC}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID}
        NEXT_PUBLIC_SENTRY_DSN: ${FRONTEND_SENTRY_DSN}
    container_name: smartcheques-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - smartcheques-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # REVERSE PROXY & SSL
  # =============================================================================

  nginx:
    image: nginx:alpine
    container_name: smartcheques-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - smartcheques-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # MONITORING & LOGGING
  # =============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: smartcheques-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - smartcheques-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: smartcheques-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3003:3000"
    networks:
      - smartcheques-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: smartcheques-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - smartcheques-network
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: smartcheques-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/app:ro
      - nginx_logs:/var/log/nginx:ro
    networks:
      - smartcheques-network
    depends_on:
      - loki
    profiles:
      - monitoring

  # =============================================================================
  # BLOCKCHAIN SERVICES (Optional)
  # =============================================================================

  hardhat-node:
    build:
      context: .
      dockerfile: Dockerfile.hardhat
    container_name: smartcheques-hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"
    networks:
      - smartcheques-network
    volumes:
      - blockchain_data:/app/data
    profiles:
      - local-blockchain

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  smartcheques-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  nginx_logs:
    driver: local
  blockchain_data:
    driver: local